name: Gerar keystore

# Rode UMA vez (Actions > Gerar keystore > Run workflow).
# Gera a chave fixa do nekodrive, mostra o SHA-1 (para o Google Cloud) e entrega um artefato
# com a keystore e as senhas. BAIXE E GUARDE: se a keystore se perder, o app precisa ser
# desinstalado para trocar de chave (perde favoritos e cache locais).

on:
  workflow_dispatch:
    inputs:
      substituir:
        description: "Gerar mesmo que já exista KEYSTORE_BASE64 (troca a chave do app!)"
        type: boolean
        default: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      # Opcional: se existir o secret GH_PAT, os secrets do build são gravados automaticamente.
      TEM_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      - name: Impedir troca acidental de chave
        env:
          JA_EXISTE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          SUBSTITUIR: ${{ inputs.substituir }}
        run: |
          if [ "$JA_EXISTE" = "true" ] && [ "$SUBSTITUIR" != "true" ]; then
            echo "::error::Já existe o secret KEYSTORE_BASE64. Gerar outra chave obriga a desinstalar o app. Marque 'substituir' só se for isso mesmo que você quer."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gerar keystore
        run: |
          PASS=$(openssl rand -hex 16)
          echo "::add-mask::$PASS"
          mkdir -p saida
          keytool -genkeypair -keystore saida/nekodrive.jks -alias nekodrive \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=nekodrive, O=nekodrive, C=BR"
          SHA1=$(keytool -list -v -keystore saida/nekodrive.jks -alias nekodrive -storepass "$PASS" | grep -m1 "SHA1:" | sed 's/^ *//')
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=nekodrive"
            echo "KEY_PASSWORD=$PASS"
            echo
            echo "$SHA1"
            echo
            echo "KEYSTORE_BASE64 (uma linha):"
            base64 -w0 saida/nekodrive.jks
            echo
          } > saida/credenciais.txt
          echo "$SHA1"
          {
            echo "### Keystore gerada"
            echo
            echo "Cole este SHA-1 no cliente OAuth Android do Google Cloud:"
            echo
            echo '```'
            echo "$SHA1"
            echo '```'
            echo
            echo "Baixe o artefato **keystore-nekodrive** e guarde em lugar seguro."
          } >> "$GITHUB_STEP_SUMMARY"
          # variáveis para o passo opcional de secrets
          echo "STORE_PASS=$PASS" >> "$GITHUB_ENV"

      - name: Gravar secrets automaticamente (opcional)
        if: env.TEM_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" --body "$(base64 -w0 saida/nekodrive.jks)"
          gh secret set KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$STORE_PASS"
          gh secret set KEY_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$STORE_PASS"
          gh secret set KEY_ALIAS --repo "$GITHUB_REPOSITORY" --body "nekodrive"
          echo "Secrets gravados. Falta só guardar o artefato como backup."

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-nekodrive
          path: saida/
          retention-days: 3
