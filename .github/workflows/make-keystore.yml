name: Gerar chave de assinatura (rodar UMA vez)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore kitsune.jks -alias kitsune \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Kitsune color, O=Kitsune, C=BR"
          {
            echo "KEY_ALIAS=kitsune"
            echo "KEY_PASS=$PASS"
            echo "KEYSTORE_B64="
            base64 -w 0 kitsune.jks
            echo
          } > keystore-info.txt
          rm kitsune.jks

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-info
          path: keystore-info.txt
          retention-days: 1
